# Alil policy — declarative rules for the boundary. Reviewed like code.
# Pipeline order: hooks -> deny -> ask -> mode -> allow -> human.
# Precedence when multiple apply: deny > defer > ask > allow. Config can only tighten.
# Paths are matched against a tool's `path` arg, relative to the workspace jail.

mode: default # ask on write/execute; read allowed

rules:
  # ── deny (hard blocks; also enforced in code by the credential-block hook) ──
  - kind: deny
    match: { pathGlob: "**/.env" }
    note: "never read/write .env files"
  - kind: deny
    match: { pathGlob: "**/.aws/**" }
    note: "never touch AWS credential files"
  - kind: deny
    match: { pathGlob: "**/*credential*" }
    note: "never touch credential-named files"
  - kind: deny
    match: { pathGlob: "**/*secret*" }
    note: "never touch secret-named files"

  # ── ask (always require a human, regardless of mode) ──
  - kind: ask
    match: { effect: write }
    note: "confirm before writing/persisting (files, memory, reminders, world state)"
  - kind: ask
    match: { effect: execute }
    note: "confirm before executing commands"
  - kind: ask
    match: { minRisk: high }
    note: "confirm high/critical-risk actions"
  - kind: ask
    match: { effect: network }
    note: "confirm network egress (web.fetch/web.search)"

  # ── allow (allowlist for otherwise-gated actions) ──
  - kind: allow
    match: { tool: fs.read }
    note: "reading within the workspace jail is safe"
  - kind: allow
    match: { tool: fs.list }
    note: "listing directories within the workspace jail is safe"
  - kind: allow
    match: { tool: fs.glob }
    note: "finding files by name within the jail is safe"
  - kind: allow
    match: { tool: fs.grep }
    note: "searching file contents within the jail is safe"
  - kind: allow
    match: { tool: doc.read }
    note: "reading a document (pdf/docx/xlsx/csv) within the jail is safe; contents are untrusted/ingested"
  - kind: allow
    match: { tool: memory.read }
    note: "reading own canonical memory is safe (memory.write/forget still require approval via the write rule)"
  - kind: allow
    match: { tool: memory.query }
    note: "searching own past-conversation memory is safe (read-only)"
  - kind: allow
    match: { tool: memory.procedure.search }
    note: "searching own procedural memory is safe (read-only); create/update still require approval"
  - kind: allow
    match: { tool: memory.procedure.fetch }
    note: "reading a proven method's steps is safe (read-only)"
  - kind: allow
    match: { tool: remind.list }
    note: "listing your own scheduled intentions is safe (read-only); create/cancel require approval"
  - kind: allow
    match: { tool: world.read }
    note: "reading your own present-tense world-model is safe (read-only); world.track/world.note are writes and require approval"
  - kind: allow
    match: { tool: dossier.query }
    note: "searching your own operator dossier is safe (read-only); dossier.create/update/supersede/delete are writes and require approval"
  - kind: allow
    match: { tool: dossier.read }
    note: "reading one operator-dossier file is safe (read-only)"
