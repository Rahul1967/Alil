<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alil</title>
  <style>
    :root {
      --bg: #faf9f6; --panel: #ffffff; --line: #e6e4dd; --ink: #1d2126;
      --ink-soft: #5b6169; --accent: #0e7c86; --accent-ink: #ffffff;
      --user-bg: #0e7c86; --user-ink: #ffffff; --bot-bg: #f1efe9; --bot-ink: #1d2126;
      --note: #8b7a3a; --note-bg: #f7f1dd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171b; --panel: #1a1e23; --line: #2a2f36; --ink: #e8eaec;
        --ink-soft: #9aa2ab; --accent: #4fb3bc; --accent-ink: #0b1416;
        --user-bg: #2d7f87; --user-ink: #f2fbfc; --bot-bg: #22272e; --bot-ink: #e8eaec;
        --note: #d9c37e; --note-bg: #2a2413;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: baseline; gap: 10px;
      padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
    }
    header h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
    header .sub { font-size: 12px; color: var(--ink-soft); }
    header .dot { width: 8px; height: 8px; border-radius: 50%; background: #b33; align-self: center; }
    header .dot.on { background: #2e9e5b; }
    main {
      flex: 1; overflow-y: auto; padding: 22px 16px;
    }
    #log { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .msg { display: flex; }
    .msg.user { justify-content: flex-end; }
    .bubble {
      max-width: 78%; padding: 10px 14px; border-radius: 14px;
      white-space: pre-wrap; word-wrap: break-word;
    }
    .user .bubble { background: var(--user-bg); color: var(--user-ink); border-bottom-right-radius: 4px; }
    .bot .bubble { background: var(--bot-bg); color: var(--bot-ink); border-bottom-left-radius: 4px; }
    .bubble .trace {
      margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(128,128,128,0.25);
      font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--ink-soft); white-space: pre-wrap;
    }
    .note { align-self: center; font-size: 12.5px; color: var(--note); background: var(--note-bg);
            border-radius: 8px; padding: 6px 12px; }
    .empty { text-align: center; color: var(--ink-soft); margin-top: 12vh; }
    .empty b { color: var(--ink); font-weight: 600; }
    footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
    form { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
    textarea {
      flex: 1; resize: none; min-height: 44px; max-height: 180px; padding: 11px 13px;
      border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink);
      font: inherit;
    }
    textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      height: 44px; padding: 0 18px; border: none; border-radius: 12px;
      background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .typing { display: inline-flex; gap: 4px; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft); animation: b 1s infinite; }
    .typing i:nth-child(2){ animation-delay: .15s } .typing i:nth-child(3){ animation-delay: .3s }
    @keyframes b { 0%,60%,100%{opacity:.3} 30%{opacity:1} }

    /* header toggle */
    .spacer { flex: 1; }
    .toggle { display: flex; gap: 2px; background: var(--bot-bg); border-radius: 9px; padding: 3px; }
    .toggle button {
      height: 30px; padding: 0 12px; border: none; border-radius: 7px; background: transparent;
      color: var(--ink-soft); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .toggle button.active { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }

    /* memory dashboard */
    #memoryView { display: none; max-width: 900px; margin: 0 auto; }
    #memoryView.show { display: block; }
    .tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
    .tabs button {
      border: none; background: transparent; color: var(--ink-soft); font: inherit; font-weight: 600;
      padding: 9px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tabs .count { font-size: 11px; color: var(--ink-soft); font-weight: 500; margin-left: 5px; }
    .rows { display: flex; flex-direction: column; gap: 8px; }
    .card { border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; background: var(--panel); }
    .card .meta { font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--ink-soft); display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 5px; }
    .card .body { white-space: pre-wrap; word-wrap: break-word; }
    .tag { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11px; font-weight: 600; }
    .tag.operator { background: #dff0e6; color: #1f6b3d; } .tag.model { background: #e2edf7; color: #245a86; }
    .tag.ingested, .tag.tainted { background: #f7e0dc; color: #a1382c; }
    .tag.system { background: #eee9dc; color: #7a6a2f; } .tag.user_channel { background: #e7e2f2; color: #574a86; }
    @media (prefers-color-scheme: dark) {
      .tag.operator { background: #17301f; color: #6cc08f; } .tag.model { background: #16283a; color: #6ba7d6; }
      .tag.ingested, .tag.tainted { background: #371b17; color: #e07a6e; }
      .tag.system { background: #2a2413; color: #d9c37e; } .tag.user_channel { background: #241f38; color: #a99ae0; }
    }
    .key { font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--accent); font-weight: 700; }
    .muted { color: var(--ink-soft); }
    .empty-tab { text-align: center; color: var(--ink-soft); padding: 8vh 0; }
    .pager { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 14px 0 4px; }
    .pager button {
      border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-weight: 600;
      padding: 6px 14px; border-radius: 8px; cursor: pointer;
    }
    .pager button:disabled { opacity: 0.4; cursor: default; }
    .pager button:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
    .pager-label { font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--ink-soft); }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>Alil</h1>
    <span class="sub" id="status">connecting…</span>
    <span class="spacer"></span>
    <div class="toggle">
      <button id="tabChat" class="active">Chat</button>
      <button id="tabMemory">Memory</button>
    </div>
  </header>
  <main>
    <div id="chatView">
      <div id="log">
        <div class="empty" id="empty">
          <b>One continuous mind.</b><br />
          This browser shares memory with the terminal — say something.
        </div>
      </div>
    </div>
    <div id="memoryView">
      <div class="tabs">
        <button data-view="timeline" class="active">Timeline <span class="count" id="c-timeline"></span></button>
        <button data-view="episodes">Episodes <span class="count" id="c-episodes"></span></button>
        <button data-view="canonical">Canonical <span class="count" id="c-canonical"></span></button>
        <button data-view="procedures">Procedures <span class="count" id="c-procedures"></span></button>
      </div>
      <div class="rows" id="memContent"></div>
    </div>
  </main>
  <footer>
    <form id="form">
      <textarea id="input" placeholder="Message Alil…  (Enter to send, Shift+Enter for newline)" autofocus></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
