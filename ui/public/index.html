<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Alil console. Color is semantic trust, not decoration: teal is the mind's own
       voice, amber is reserved for the moment it pauses and asks (HITL), and provenance
       keeps its meaning (operator/model/tainted). Light palette on bare :root; dark
       redefines the same roles. ────────────────────────────────────────────────── */
    :root {
      --ground: #f6f5f2; --panel: #ffffff; --panel-2: #efede8;
      --line: #e2dfd7; --line-strong: #d0ccc0;
      --ink: #17201f; --ink-soft: #5f6a68; --ink-faint: #97a09d;
      --mind: #0f8b80; --mind-soft: #d7efec;        /* teal — the assistant's voice */
      --signal: #b9741a; --signal-soft: #f8ecd6; --signal-line: #e6b877; /* amber — HITL */
      --op: #2f7d4f; --op-soft: #dcefe1;
      --model: #35678f; --model-soft: #e0eaf3;
      --taint: #b0402c; --taint-soft: #f4ddd6;
      --sys: #7a6320; --sys-soft: #efe6cf;
      --chan: #4b4088; --chan-soft: #e6e1f4;
      --send: #0f8b80; --send-ink: #ffffff;
      --shadow: 0 1px 2px rgba(20,28,26,.06), 0 8px 24px -18px rgba(20,28,26,.4);
      --radius: 13px;
    }
    :root:not([data-theme="light"]) {
      @media (prefers-color-scheme: dark) {
        --ground: #0f1417; --panel: #161d20; --panel-2: #1c2529;
        --line: #26312f; --line-strong: #33403d;
        --ink: #e7edeb; --ink-soft: #93a09c; --ink-faint: #5f6f6b;
        --mind: #39b0a6; --mind-soft: #10312e;
        --signal: #e0982f; --signal-soft: #2c2113; --signal-line: #5a4322;
        --op: #4faa72; --op-soft: #16301f;
        --model: #5f9bd4; --model-soft: #16283a;
        --taint: #dd6f57; --taint-soft: #341c16;
        --sys: #cdb066; --sys-soft: #2a2413;
        --chan: #9c8fe4; --chan-soft: #211c39;
        --send: #39b0a6; --send-ink: #06201d;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -20px rgba(0,0,0,.7);
      }
    }
    :root[data-theme="dark"] {
      --ground: #0f1417; --panel: #161d20; --panel-2: #1c2529;
      --line: #26312f; --line-strong: #33403d;
      --ink: #e7edeb; --ink-soft: #93a09c; --ink-faint: #5f6f6b;
      --mind: #39b0a6; --mind-soft: #10312e;
      --signal: #e0982f; --signal-soft: #2c2113; --signal-line: #5a4322;
      --op: #4faa72; --op-soft: #16301f;
      --model: #5f9bd4; --model-soft: #16283a;
      --taint: #dd6f57; --taint-soft: #341c16;
      --sys: #cdb066; --sys-soft: #2a2413;
      --chan: #9c8fe4; --chan-soft: #211c39;
      --send: #39b0a6; --send-ink: #06201d;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -20px rgba(0,0,0,.7);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--ground); color: var(--ink);
      font: 15px/1.6 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

    /* ── Header: wordmark + live console readout + segmented view switch ── */
    header {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 20px; border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      backdrop-filter: blur(8px);
      position: sticky; top: 0; z-index: 5;
    }
    .brand { display: flex; align-items: baseline; gap: 9px; }
    header h1 {
      font: 700 20px/1 "Space Grotesk", system-ui, sans-serif;
      letter-spacing: -0.02em; margin: 0; color: var(--ink);
    }
    header h1 .k { color: var(--mind); }
    .readout {
      display: inline-flex; align-items: center; gap: 8px;
      font: 500 11.5px/1 "IBM Plex Mono", monospace; color: var(--ink-soft);
      padding: 5px 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--panel);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--taint); box-shadow: 0 0 0 0 currentColor; }
    .dot.on { background: var(--op); color: var(--op); animation: pulse 2.6s ease-out infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--op) 55%, transparent); } 70%,100% { box-shadow: 0 0 0 6px transparent; } }
    .spacer { flex: 1; }
    .toggle { display: flex; gap: 3px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
    .toggle button {
      height: 30px; padding: 0 14px; border: none; border-radius: 7px; background: transparent;
      color: var(--ink-soft); font: 600 13px/1 "IBM Plex Sans", sans-serif; cursor: pointer; transition: .15s;
    }
    .toggle button.active { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
    .toggle button:not(.active):hover { color: var(--ink); }

    main { flex: 1; overflow-y: auto; padding: 26px 16px 30px; }

    /* ── Conversation ── */
    #log { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
    .msg { display: flex; animation: rise .28s cubic-bezier(.2,.7,.3,1) both; }
    .msg.user { justify-content: flex-end; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .msg { animation: none; } }

    .bubble { max-width: 82%; padding: 11px 15px; white-space: pre-wrap; word-wrap: break-word; }
    /* Operator: quiet raised panel, right. The mind: a teal voice-edge, left. */
    .user .bubble {
      background: var(--panel); border: 1px solid var(--line-strong);
      border-radius: 15px 15px 5px 15px; box-shadow: var(--shadow);
    }
    .bot .bubble {
      background: var(--panel); border: 1px solid var(--line);
      border-left: 2.5px solid var(--mind); border-radius: 4px 15px 15px 15px;
    }
    /* Trace: instrument readout hung beneath the mind's reply. */
    .bubble .trace {
      margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--line-strong);
      font: 500 12px/1.65 "IBM Plex Mono", monospace; color: var(--ink-soft); white-space: pre-wrap;
    }

    .note {
      align-self: center; font: 500 12px/1.4 "IBM Plex Mono", monospace; color: var(--ink-soft);
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 13px;
    }

    /* ── SIGNATURE: the approval gate. The mind's hand, paused at the boundary. ── */
    .approval {
      align-self: stretch; max-width: 560px; width: 100%; margin: 4px auto;
      border: 1px solid var(--signal-line); border-radius: var(--radius);
      background: linear-gradient(var(--signal-soft), var(--panel) 62%);
      box-shadow: var(--shadow); overflow: hidden;
    }
    .approval-head {
      display: flex; align-items: center; gap: 9px;
      padding: 12px 15px 11px; border-bottom: 1px solid var(--signal-line);
      font: 600 13.5px/1.35 "Space Grotesk", "IBM Plex Sans", sans-serif; color: var(--ink);
    }
    .approval-head::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none;
      background: var(--signal); box-shadow: 0 0 0 0 var(--signal);
      animation: beacon 1.7s ease-out infinite;
    }
    @keyframes beacon { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--signal) 60%, transparent); } 70%,100% { box-shadow: 0 0 0 7px transparent; } }
    @media (prefers-reduced-motion: reduce) { .approval-head::before, .dot.on { animation: none; } }
    .approval.resolved { opacity: .72; }
    .approval.resolved .approval-head::before { animation: none; background: var(--ink-faint); box-shadow: none; }
    .approval-reason { padding: 11px 15px 4px; font-size: 13px; color: var(--ink-soft); }
    .approval-args {
      margin: 8px 15px 13px; padding: 9px 11px;
      font: 500 12px/1.55 "IBM Plex Mono", monospace; color: var(--ink);
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
      overflow-x: auto; white-space: pre-wrap; word-break: break-all;
    }
    .approval-btns { display: flex; gap: 10px; padding: 0 15px 15px; }
    .approval-btns button {
      flex: 1; padding: 10px 12px; border-radius: 9px; cursor: pointer;
      font: 600 13.5px/1 "IBM Plex Sans", sans-serif; border: 1px solid transparent; transition: .12s;
    }
    .approval-btns .approve { background: var(--signal); color: #fff; }
    .approval-btns .approve:hover { filter: brightness(1.06); }
    .approval-btns .reject { background: var(--panel); color: var(--ink); border-color: var(--line-strong); }
    .approval-btns .reject:hover { border-color: var(--taint); color: var(--taint); }
    .approval-btns button:disabled { opacity: .5; cursor: default; filter: none; }

    /* ── Empty state: an invitation, in the interface's voice ── */
    .empty { text-align: center; color: var(--ink-soft); margin: 16vh auto 0; max-width: 440px; }
    .empty b { display: block; font: 600 22px/1.2 "Space Grotesk", sans-serif; color: var(--ink); letter-spacing: -0.02em; margin-bottom: 8px; }

    /* ── Composer ── */
    footer { border-top: 1px solid var(--line); background: var(--panel); padding: 13px 16px; }
    form { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
    textarea {
      flex: 1; resize: none; min-height: 46px; max-height: 180px; padding: 12px 14px;
      border: 1px solid var(--line-strong); border-radius: 12px; background: var(--ground); color: var(--ink);
      font: 15px/1.5 "IBM Plex Sans", sans-serif; transition: border-color .12s, box-shadow .12s;
    }
    textarea::placeholder { color: var(--ink-faint); }
    textarea:focus { outline: none; border-color: var(--mind); box-shadow: 0 0 0 3px color-mix(in srgb, var(--mind) 22%, transparent); }
    #send {
      height: 46px; padding: 0 20px; border: none; border-radius: 12px;
      background: var(--send); color: var(--send-ink);
      font: 600 14px/1 "IBM Plex Sans", sans-serif; cursor: pointer; transition: .12s;
    }
    #send:hover:not(:disabled) { filter: brightness(1.06); }
    #send:disabled { opacity: .45; cursor: default; }

    .typing { display: inline-flex; gap: 5px; padding: 3px 0; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--mind); animation: b 1.1s infinite; }
    .typing i:nth-child(2){ animation-delay: .16s } .typing i:nth-child(3){ animation-delay: .32s }
    @keyframes b { 0%,60%,100%{opacity:.28; transform: translateY(0)} 30%{opacity:1; transform: translateY(-2px)} }

    /* ── Memory dashboard ── */
    #memoryView { display: none; max-width: 860px; margin: 0 auto; }
    #memoryView.show { display: block; }
    .tabs { display: flex; gap: 2px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
    .tabs button {
      border: none; background: transparent; color: var(--ink-soft);
      font: 600 13.5px/1 "IBM Plex Sans", sans-serif;
      padding: 10px 15px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .12s;
    }
    .tabs button:hover { color: var(--ink); }
    .tabs button.active { color: var(--mind); border-bottom-color: var(--mind); }
    .tabs .count { font: 500 11px/1 "IBM Plex Mono", monospace; color: var(--ink-faint); margin-left: 6px; }
    .rows { display: flex; flex-direction: column; gap: 9px; }
    .card { border: 1px solid var(--line); border-radius: 11px; padding: 13px 15px; background: var(--panel); box-shadow: var(--shadow); }
    .card .meta { font: 500 11px/1.5 "IBM Plex Mono", monospace; color: var(--ink-soft); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 7px; }
    .card .body { white-space: pre-wrap; word-wrap: break-word; }

    /* Provenance tags carry meaning — same color language as the chat. */
    .tag { display: inline-block; padding: 2px 9px; border-radius: 99px; font: 600 11px/1.5 "IBM Plex Mono", monospace; }
    .tag.operator { background: var(--op-soft); color: var(--op); }
    .tag.model { background: var(--model-soft); color: var(--model); }
    .tag.ingested, .tag.tainted { background: var(--taint-soft); color: var(--taint); }
    .tag.system { background: var(--sys-soft); color: var(--sys); }
    .tag.user_channel { background: var(--chan-soft); color: var(--chan); }

    .key { font: 600 12px/1.5 "IBM Plex Mono", monospace; color: var(--mind); }
    .muted { color: var(--ink-soft); }
    .empty-tab { text-align: center; color: var(--ink-soft); padding: 9vh 0; font-family: "IBM Plex Mono", monospace; font-size: 13px; }
    .pager { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 16px 0 4px; }
    .pager button {
      border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink);
      font: 600 13px/1 "IBM Plex Sans", sans-serif; padding: 7px 15px; border-radius: 9px; cursor: pointer; transition: .12s;
    }
    .pager button:disabled { opacity: .38; cursor: default; }
    .pager button:not(:disabled):hover { border-color: var(--mind); color: var(--mind); }
    .pager-label { font: 500 12px/1 "IBM Plex Mono", monospace; color: var(--ink-soft); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>alil<span class="k">.</span></h1>
    </div>
    <span class="readout"><span class="dot" id="dot"></span><span id="status">connecting…</span></span>
    <span class="spacer"></span>
    <div class="toggle">
      <button id="tabChat" class="active">Chat</button>
      <button id="tabMemory">Memory</button>
    </div>
  </header>
  <main>
    <div id="chatView">
      <div id="log">
        <div class="empty" id="empty">
          <b>One mind, watching itself.</b>
          This window shares memory with the terminal. When Alil needs to touch
          something real, it stops and asks you right here. Say something to begin.
        </div>
      </div>
    </div>
    <div id="memoryView">
      <div class="tabs">
        <button data-view="timeline" class="active">Timeline <span class="count" id="c-timeline"></span></button>
        <button data-view="episodes">Episodes <span class="count" id="c-episodes"></span></button>
        <button data-view="canonical">Canonical <span class="count" id="c-canonical"></span></button>
        <button data-view="procedures">Procedures <span class="count" id="c-procedures"></span></button>
      </div>
      <div class="rows" id="memContent"></div>
    </div>
  </main>
  <footer>
    <form id="form">
      <textarea id="input" placeholder="Message Alil…  ·  Enter sends, Shift+Enter for a new line" autofocus></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
